<text x="600" y="83" text-anchor="middle" fill="#bad6ad" font-family="system-ui,sans-serif" font-size="13" letter-spacing="2">ORIGINAL ENCOUNTER SILHOUETTES · PRE-PRODUCTION STUDY</text>
