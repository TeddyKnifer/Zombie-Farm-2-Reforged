 <text x="175" y="486" text-anchor="middle" fill="#f3e2bc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">HEAVY-SLAM TELEGRAPH</text>
 <text x="175" y="508" text-anchor="middle" fill="#d3c4a5" font-family="system-ui,sans-serif" font-size="11">A widening ground ring signals the impact</text>
 <text x="175" y="536" text-anchor="middle" fill="#c5b38e" font-family="system-ui,sans-serif" font-size="10">armoured bruiser · slow readable attacks</text>
