<text x="600" y="724" text-anchor="middle" fill="#b8d3a9" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">CONCEPTS ONLY · NO COMBAT DATA OR REWARDS IMPLEMENTED</text>
</svg>