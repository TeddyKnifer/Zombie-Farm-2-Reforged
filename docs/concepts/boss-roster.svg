<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Expanded Edition original boss roster concepts</title>
<desc id="desc">Three original fantasy farm bosses: Rotwood Keeper, Lantern Queen and Compost Colossus. Each panel shows a distinct silhouette and telegraphed attack idea.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1a3038"/><stop offset="1" stop-color="#0b1b22"/></linearGradient>
 <linearGradient id="bark" x2=".8" y2="1"><stop stop-color="#a77b4e"/><stop offset="1" stop-color="#3f4937"/></linearGradient>
 <linearGradient id="ghost" x2="0" y2="1"><stop stop-color="#e6ffc4"/><stop offset=".5" stop-color="#8fdfb0"/><stop offset="1" stop-color="#447e8c"/></linearGradient>
 <linearGradient id="compost" x2="0" y2="1"><stop stop-color="#b9a16b"/><stop offset="1" stop-color="#57432e"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f1ffd1"/><stop offset=".55" stop-color="#b4ec83"/><stop offset="1" stop-color="#548f68"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="760" rx="32" fill="url(#bg)"/>
