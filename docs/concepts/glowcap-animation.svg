<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Glowcap animation and rig production storyboard</title>
<desc id="desc">A four-pose idle sequence and four-pose attack sequence for an original mushroom zombie, with consistent head and body placement.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172c35"/><stop offset="1" stop-color="#101d27"/></linearGradient>
 <linearGradient id="skin" x2=".9" y2="1"><stop stop-color="#b6e17a"/><stop offset="1" stop-color="#558d55"/></linearGradient>
 <radialGradient id="cap"><stop stop-color="#e7ffb8"/><stop offset=".5" stop-color="#9de56d"/><stop offset="1" stop-color="#418b70"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="960" height="600" rx="28" fill="url(#bg)"/>
<text x="480" y="42" text-anchor="middle" fill="#efffda" font-family="system-ui,sans-serif" font-size="21" font-weight="800" letter-spacing="4">GLOWCAP · ANIMATION BLOCKING</text>
<text x="245" y="86" text-anchor="middle" fill="#c9e9ad" font-family="system-ui,sans-serif" font-size="15" font-weight="800">IDLE · FOUR-POSE LOOP</text>
<text x="715" y="86" text-anchor="middle" fill="#c9e9ad" font-family="system-ui,sans-serif" font-size="15" font-weight="800">ATTACK · FOUR-POSE ACTION</text>
<g stroke="#8aa879" stroke-opacity=".25" fill="none"><rect x="35" y="108" width="420" height="365" rx="15"/><rect x="505" y="108" width="420" height="365" rx="15"/></g>
<!-- four idle panels -->
<g transform="translate(48 125)">
 <g transform="translate(0 0)"><path d="M42 244 H65 M42 244 V50" stroke="#77966e" stroke-opacity=".3"/><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><path d="M68 191 Q78 199 89 191" fill="none" stroke="#35573b" stroke-width="3"/><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">01 neutral</text></g>
 <g transform="translate(100 -8)"><ellipse cx="78" cy="252" rx="45" ry="7" fill="#081419"/><path d="M57 155 Q48 185 52 234 L103 234 Q108 185 96 155Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 145 Q43 95 78 83 Q114 95 106 145 Q78 160 50 145Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="182" r="4"/><circle cx="88" cy="182" r="4"/></g><path d="M68 199 Q78 207 89 199" fill="none" stroke="#35573b" stroke-width="3"/><text x="78" y="286" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">02 rise</text></g>
 <g transform="translate(200 0)"><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><path d="M68 191 Q78 199 89 191" fill="none" stroke="#35573b" stroke-width="3"/><g fill="#e5ffc1" filter="url(#glow)"><circle cx="40" cy="118" r="3"/><circle cx="118" cy="130" r="3"/></g><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">03 peak glow</text></g>
 <g transform="translate(300 -5)"><ellipse cx="78" cy="249" rx="45" ry="7" fill="#081419"/><path d="M57 152 Q48 182 52 231 L103 231 Q108 182 96 152Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 147 Q43 97 78 85 Q114 97 106 147 Q78 162 50 147Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="179" r="4"/><circle cx="88" cy="179" r="4"/></g><path d="M68 196 Q78 204 89 196" fill="none" stroke="#35573b" stroke-width="3"/><text x="78" y="283" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">04 settle</text></g>
</g>
<!-- four attack poses -->
<g transform="translate(518 125)">
 <g transform="translate(0 0)"><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><path d="M68 191 Q78 199 89 191" fill="none" stroke="#35573b" stroke-width="3"/><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">01 wind-up</text></g>
 <g transform="translate(100 0)"><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><g fill="#dfffad" filter="url(#glow)"><circle cx="78" cy="104" r="18" opacity=".65"/><circle cx="40" cy="142" r="4"/><circle cx="118" cy="145" r="4"/></g><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">02 charge</text></g>
 <g transform="translate(200 0)"><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><g fill="#c8f6a3" filter="url(#glow)"><circle cx="30" cy="126" r="7"/><circle cx="46" cy="108" r="5"/><circle cx="122" cy="119" r="8"/><circle cx="139" cy="139" r="5"/><circle cx="78" cy="78" r="7"/></g><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">03 spore burst</text></g>
 <g transform="translate(300 0)"><ellipse cx="78" cy="244" rx="45" ry="7" fill="#081419"/><path d="M57 147 Q48 177 52 226 L103 226 Q108 177 96 147Z" fill="url(#skin)" stroke="#315c43" stroke-width="4"/><path d="M50 151 Q43 101 78 91 Q114 101 106 151 Q78 166 50 151Z" fill="url(#cap)" stroke="#d9ffad" stroke-width="4"/><g fill="#263a2c"><circle cx="68" cy="174" r="4"/><circle cx="88" cy="174" r="4"/></g><path d="M68 191 Q78 199 89 191" fill="none" stroke="#35573b" stroke-width="3"/><text x="78" y="278" fill="#efffda" text-anchor="middle" font-size="12" font-family="system-ui">04 recover</text></g>
</g>
<g font-family="system-ui,sans-serif" fill="#c6e2b4" font-size="12">
 <text x="480" y="530" text-anchor="middle">Blocking guide only — not final sprite frames or timing.</text>
 <text x="480" y="554" text-anchor="middle">Keep cap / head pivot consistent; author transparent parts separately for the rig.</text>
 <text x="480" y="578" text-anchor="middle">Final frame count, fps, filenames and offsets must match the approved SpecialZombieManifest.</text>
</g>
</svg>