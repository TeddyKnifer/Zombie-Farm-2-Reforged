<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">Mooncap Crown mutation concept</title>
<desc id="desc">A friendly green zombie head wearing a luminous crescent mushroom crown, shown as a head-slot mutation study.</desc>
